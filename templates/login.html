<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 — 外刊精读</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f1ea; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { background: #fff; padding: 40px 50px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 320px; }
  h1 { margin: 0 0 6px; font-size: 22px; color: #2a2a2a; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; margin-bottom: 12px; }
  button { width: 100%; padding: 12px; background: #2a2a2a; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #444; }
  .err { color: #c33; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="box">
  <h1>{% if role == 'admin' %}管理后台{% else %}外刊精读{% endif %}</h1>
  <div class="sub">请输入访问密码</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="密码" autofocus required>
    <button type="submit">进入</button>
  </form>
</div>
</body>
</html>
